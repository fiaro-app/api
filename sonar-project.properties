sonar.projectKey=fiaro-app_api
sonar.organization=fiaro-app
sonar.sources=src
sonar.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,dist/**,docs/**
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
# Cobertura de las pruebas unitarias (vitest.config.ts); main.ts y los módulos de Nest los cubren las e2e.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.ts,src/**/*.module.ts
