sonar.projectKey=fiaro-app_api
sonar.organization=fiaro-app
sonar.sources=src
sonar.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,dist/**,docs/**
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
# Cobertura de las pruebas unitarias; las exclusiones deben coincidir con las de vitest.config.ts.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.ts,src/app.setup.ts,src/**/*.module.ts,src/**/*.token.ts
