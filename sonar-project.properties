sonar.projectKey=fiaro-app_api
sonar.organization=fiaro-app
sonar.sources=src
sonar.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,dist/**,docs/**,src/**/generated/**,src/**/migrations/**
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
# Cobertura de las pruebas unitarias y e2e juntas (`pnpm test:cov`); las exclusiones deben coincidir
# con las de vitest.config.ts (el código generado ya está en sonar.exclusions).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.ts
