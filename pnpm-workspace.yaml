# Nuestros propios paquetes se instalan apenas se publican: el período de espera de
# pnpm (protección contra paquetes comprometidos) aplica solo a paquetes de terceros.
minimumReleaseAgeExclude:
  - '@fiaro-app/*'

# Scripts de instalación de terceros: pnpm 11 no los ejecuta salvo autorización explícita.
# `@swc/core` y `unrs-resolver` solo verifican su binario nativo; `@scarf/scarf` envía telemetría.
# `prisma` solo comprueba la versión de Node; `@prisma/engines` descarga el motor de migraciones,
# que el CLI descarga por su cuenta la primera vez que lo usa: sin código ajeno al instalar.
allowBuilds:
  '@prisma/engines': false
  '@scarf/scarf': false
  '@swc/core': false
  prisma: false
  unrs-resolver: false
