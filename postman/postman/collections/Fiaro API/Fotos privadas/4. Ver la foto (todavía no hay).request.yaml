$kind: http-request
description: "La foto nunca es pública: se ve con una URL firmada que vence en minutos. Sin foto, url es null."
url: "{{baseUrl}}/clients/{{photoClientId}}/photo"
method: GET
headers:
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      pm.test('todavía no tiene foto', () => pm.expect(pm.response.json().url).to.be.null);
    language: text/javascript
order: 4000
