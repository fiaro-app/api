$kind: http-request
description: "Repetirlo no falla: responde 204 aunque no haya foto."
url: "{{baseUrl}}/clients/{{photoClientId}}/photo"
method: DELETE
headers:
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 5000
