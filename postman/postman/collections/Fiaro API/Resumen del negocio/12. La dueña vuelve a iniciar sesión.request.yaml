$kind: http-request
description: "El resumen del negocio exige rol OWNER o LENDER (el cobrador recibiría 403): vuelve a entrar como la dueña, lo que reemplaza en el cookie jar la sesión del cobrador que abrió el paso 8."
url: "{{baseUrl}}/auth/sign-in/phone-number"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
body:
  type: json
  content: |-
    {
      "phoneNumber": "{{dashboardOwnerPhone}}",
      "password": "{{dashboardOwnerPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      pm.test('llega la cookie de sesión', () => pm.expect(pm.cookies.has('fiaro.session_token')).to.be.true);
    language: text/javascript
order: 12000
