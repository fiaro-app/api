$kind: http-request
description: Dos cuotas de 10.000 (total 20.000), para pagarlo del todo en dos visitas y ver el cierre automático a PAID_OFF.
url: "{{baseUrl}}/loans"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
body:
  type: json
  content: |-
    {
      "clientId": "{{reversalClientId}}",
      "principalAmount": 20000,
      "installmentCount": 2,
      "installmentValue": 10000,
      "totalPayable": 20000,
      "frequency": "DAILY",
      "startDate": "2026-10-01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 201', () => pm.response.to.have.status(201));
      pm.test('nace ACTIVE', () => pm.expect(pm.response.json().status).to.eql('ACTIVE'));
      pm.collectionVariables.set('reversalLoanId', pm.response.json().id);
    language: text/javascript
order: 4000
