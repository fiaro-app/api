$kind: http-example
request:
  url: "{{baseUrl}}/auth/sign-in/phone-number"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Origin
      value: "{{baseUrl}}"
      description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
  body:
    type: json
    content: |-
      {
        "phoneNumber": "{{phone}}",
        "password": "no-es-la-contraseña"
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "RATE_LIMITED",
        "message": "Demasiadas solicitudes. Intenta de nuevo en unos segundos."
      }
order: 1000
