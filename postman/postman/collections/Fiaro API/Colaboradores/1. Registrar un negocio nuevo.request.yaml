$kind: http-request
description: "Público, sin sesión. Esta carpeta es autocontenida: registra su propio negocio en vez de depender de la sesión de otra carpeta. El script previo genera un celular y una cédula al azar, para poder repetir la carpeta sin chocar con una corrida anterior."
url: "{{baseUrl}}/register"
method: POST
headers:
  - key: cf-turnstile-response
    value: "{{turnstileToken}}"
    description: Token de Cloudflare Turnstile. Solo se exige si la API tiene CLOUDFLARE_TURNSTILE_SECRET_KEY; con la llave secreta de prueba vale cualquier token.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "phone": "{{membershipsOwnerPhone}}",
      "fullName": "Beatriz Londoño (dueña de prueba de colaboradores)",
      "password": "{{membershipsOwnerPassword}}",
      "nationalId": "{{membershipsOwnerNationalId}}",
      "businessName": "Créditos Beatriz (prueba de colaboradores)",
      "acceptedTerms": true,
      "acceptedPrivacy": true,
      "acceptedDataResponsibility": true,
      "marketingConsent": false,
      "legalVersion": "2026-10-16"
    }
scripts:
  - type: prerequest
    code: |-
      const ownerSuffix = Math.floor(100000000 + Math.random() * 900000000);
      pm.collectionVariables.set('membershipsOwnerPhone', `+573${ownerSuffix}`);
      const ownerNationalId = Math.floor(10000000 + Math.random() * 90000000);
      pm.collectionVariables.set('membershipsOwnerNationalId', `${ownerNationalId}`);
      pm.collectionVariables.set('membershipsOwnerPassword', 'Colombia-Fiaro-2026-prueba');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('responde 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 1000
