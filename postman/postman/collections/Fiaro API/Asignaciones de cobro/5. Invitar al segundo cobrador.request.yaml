$kind: http-request
description: Un segundo cobrador, para probar la reasignación.
url: "{{baseUrl}}/memberships"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
body:
  type: json
  content: |-
    {
      "phone": "{{assignmentsCollector2Phone}}",
      "fullName": "Cobrador Dos (prueba de asignaciones)",
      "nationalId": "{{assignmentsCollector2NationalId}}",
      "contactEmail": "cobrador-{{assignmentsCollector2NationalId}}@example.com",
      "roles": ["COLLECTOR"],
      "portfolioId": "{{assignmentsPortfolioId}}"
    }
scripts:
  - type: prerequest
    code: |-
      const suffix = Math.floor(100000000 + Math.random() * 900000000);
      pm.collectionVariables.set('assignmentsCollector2Phone', `+573${suffix}`);
      const nationalId = Math.floor(10000000 + Math.random() * 90000000);
      pm.collectionVariables.set('assignmentsCollector2NationalId', `${nationalId}`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('responde 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('assignmentsCollector2MembershipId', pm.response.json().membership.id);
    language: text/javascript
order: 5000
