$kind: http-request
description: Exige rol OWNER o LENDER (PRODUCT.md §5), que la dueña ya tiene.
url: "{{baseUrl}}/daily-settlements/{{settlementId}}/approve"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      pm.test('queda APPROVED', () => pm.expect(pm.response.json().status).to.eql('APPROVED'));
    language: text/javascript
order: 5000
