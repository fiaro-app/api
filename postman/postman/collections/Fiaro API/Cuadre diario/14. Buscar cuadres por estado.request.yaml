$kind: http-request
description: "Cuadres del prestamista con el que opera la sesión, filtrados por estado (método QUERY, ARCHITECTURE.md §5). Cualquier rol puede verla."
url: "{{baseUrl}}/daily-settlements"
method: QUERY
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
body:
  type: json
  content: |-
    {
      "status": "APPROVED"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('encuentra el cuadre de prueba', () => pm.expect(body.data.some((settlement) => settlement.id === pm.collectionVariables.get('settlementId'))).to.be.true);
    language: text/javascript
order: 14000
