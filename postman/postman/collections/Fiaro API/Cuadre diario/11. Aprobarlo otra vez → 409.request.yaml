$kind: http-request
description: "Un cuadre ya revisado no se vuelve a revisar: solo mientras sigue PENDING. Responde CONFLICT, código genérico (mismo criterio que D-80/D-81/D-85)."
url: "{{baseUrl}}/daily-settlements/{{settlementId}}/approve"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 409', () => pm.response.to.have.status(409));
      pm.test('código CONFLICT', () => pm.expect(pm.response.json().code).to.eql('CONFLICT'));
    language: text/javascript
order: 11000
