$kind: http-request
description: "Público, sin sesión. Esta carpeta es autocontenida: registra su propio negocio. El script previo genera un celular y una cédula al azar, para poder repetir la carpeta sin chocar con una corrida anterior."
url: "{{baseUrl}}/register"
method: POST
headers:
  - key: cf-turnstile-response
    value: "{{turnstileToken}}"
    description: Token de Cloudflare Turnstile. Solo se exige si la API tiene CLOUDFLARE_TURNSTILE_SECRET_KEY; con la llave secreta de prueba vale cualquier token.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "phone": "{{routeOwnerPhone}}",
      "fullName": "Rosa Camino (dueña de prueba de rutas)",
      "password": "{{routeOwnerPassword}}",
      "nationalId": "{{routeOwnerNationalId}}",
      "businessName": "Créditos Rosa (prueba de rutas)",
      "acceptedTerms": true,
      "acceptedPrivacy": true,
      "acceptedDataResponsibility": true,
      "marketingConsent": false,
      "legalVersion": "2026-10-16"
    }
scripts:
  - type: prerequest
    code: |-
      const ownerSuffix = Math.floor(100000000 + Math.random() * 900000000);
      pm.collectionVariables.set('routeOwnerPhone', `+573${ownerSuffix}`);
      const ownerNationalId = Math.floor(10000000 + Math.random() * 90000000);
      pm.collectionVariables.set('routeOwnerNationalId', `${ownerNationalId}`);
      pm.collectionVariables.set('routeOwnerPassword', 'Colombia-Fiaro-2026-prueba');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('responde 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('routeOwnerMembershipId', pm.response.json().membership.id);
    language: text/javascript
order: 1000
