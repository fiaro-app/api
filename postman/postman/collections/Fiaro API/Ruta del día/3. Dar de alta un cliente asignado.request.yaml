$kind: http-request
description: "El cliente del préstamo que se va a asignar. La cédula usa {{$timestamp}} para que la carpeta se pueda repetir sin chocar con la de la vez anterior."
url: "{{baseUrl}}/clients"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
body:
  type: json
  content: |-
    {
      "nationalId": "{{$timestamp}}",
      "fullName": "Camilo Asignado",
      "occupation": "Comerciante",
      "phone": "+573005554433",
      "address": "Calle 30 # 9-20, Bogotá"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('routeAssignedClientId', pm.response.json().id);
    language: text/javascript
order: 3000
