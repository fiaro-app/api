$kind: http-request
description: "La app lo consulta antes de mostrar cualquier pantalla (PRODUCT.md §10), sin sesión. Compara su propia versión contra minimumSupportedVersion con compareAppVersions de @fiaro-app/contracts."
url: "{{baseUrl}}/mobile/version"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('trae las tres versiones mínimas, más reciente y de dónde descargar', () => {
        pm.expect(body.minimumSupportedVersion).to.match(/^\d+\.\d+\.\d+$/);
        pm.expect(body.latestVersion).to.match(/^\d+\.\d+\.\d+$/);
        pm.expect(body.downloadUrl).to.be.a('string');
      });
    language: text/javascript
order: 2000
