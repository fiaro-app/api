$kind: http-request
description: "Cambia a la sesión de Carla Ruiz, la cuenta de prueba dedicada a desactivarse (D-71): los pasos que siguen son irreversibles, así que no usan a Ana."
url: "{{baseUrl}}/auth/sign-in/phone-number"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
body:
  type: json
  content: |-
    {
      "phoneNumber": "{{deactivationPhone}}",
      "password": "{{deactivationPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      pm.test('llega la cookie de sesión', () => pm.expect(pm.cookies.has('fiaro.session_token')).to.be.true);
    language: text/javascript
order: 6000
