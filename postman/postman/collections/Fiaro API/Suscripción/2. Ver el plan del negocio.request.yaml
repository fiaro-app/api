$kind: http-request
description: "La suscripción del Tenant del prestamista con el que opera la sesión (D-115). Todo negocio nace con una prueba. Informa el estado, los topes del plan y cuánto se usa; los topes los aplican quienes crean (cobradores, administradores, carteras y préstamos activos: `PLAN_LIMIT_REACHED`), pasada la gracia las escrituras responden 403 SUBSCRIPTION_READ_ONLY (D-148), salvo visitas, pagos y cuadres."
url: "{{baseUrl}}/subscription"
method: GET
headers:
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('trae el plan y su estado', () => {
        pm.expect(['TRIAL', 'INDIVIDUAL', 'PRO', 'TEAM']).to.include(body.planCode);
        pm.expect(['ACTIVE', 'GRACE_PERIOD', 'READ_ONLY']).to.include(body.status);
      });
      pm.test('trae los límites y el uso', () => {
        pm.expect(body.limits.maxCollectors).to.be.a('number');
        pm.expect(body.limits.maxAdmins).to.be.a('number');
        pm.expect(body.limits.maxPortfolios).to.be.a('number');
        pm.expect(body.usage.activeLenders).to.be.a('number');
        pm.expect(body.usage.activeAdmins).to.be.a('number');
        pm.expect(body.usage.activeLoans).to.be.a('number');
        pm.expect(body.limits.maxActiveLoans === null || typeof body.limits.maxActiveLoans === 'number').to.eql(true);
      });
    language: text/javascript
order: 2000
