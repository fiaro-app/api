$kind: http-request
description: Sin dinero esta vez; promisedDate hace que el préstamo reaparezca en la ruta ese día.
url: "{{baseUrl}}/loans/{{visitsLoanId}}/collection-visits"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
body:
  type: json
  content: |-
    {
      "id": "{{visitsRescheduledVisitId}}",
      "outcome": "RESCHEDULED",
      "promisedDate": "2026-10-05",
      "occurredAt": "2026-10-02T14:00:00.000Z"
    }
scripts:
  - type: prerequest
    code: |-
      pm.collectionVariables.set('visitsRescheduledVisitId', pm.variables.replaceIn('{{$guid}}'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('responde 201', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('sin pago', () => pm.expect(body.payment).to.be.null);
      pm.test('trae la fecha prometida', () => pm.expect(body.promisedDate).to.eql('2026-10-05'));
    language: text/javascript
order: 12000
