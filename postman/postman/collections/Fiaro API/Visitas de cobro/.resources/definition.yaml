$kind: collection
description: |-
  Bitácora de cobro de un préstamo del prestamista con el que opera la sesión (D-83): `POST`/`GET
  /loans/:loanId/collection-visits`, protegidas por `LenderScopeGuard`. Autocontenida: registra
  su propio negocio, invita a un cobrador, da de alta un cliente y un préstamo, y deja al
  cobrador con su sesión abierta para el resto de la carpeta. El paso de reenvío confirma la
  idempotencia (D-29): la misma visita nunca duplica el pago.
order: 1995
