$kind: http-request
description: Confirma que las dos visitas queden registradas (el reenvío del paso 11 no agregó una tercera).
url: "{{baseUrl}}/loans/{{visitsLoanId}}/collection-visits"
method: GET
headers:
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('tiene las dos visitas, no tres', () => pm.expect(body).to.have.lengthOf(2));
    language: text/javascript
order: 13000
