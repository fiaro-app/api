$kind: http-request
description: Acuerdo de pago para el cliente de prueba, al que se le registrarán visitas de cobro.
url: "{{baseUrl}}/loans"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
body:
  type: json
  content: |-
    {
      "clientId": "{{visitsClientId}}",
      "principalAmount": 500000,
      "installmentCount": 20,
      "installmentValue": 30000,
      "totalPayable": 600000,
      "frequency": "DAILY",
      "startDate": "2026-10-01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('visitsLoanId', pm.response.json().id);
    language: text/javascript
order: 6000
