$kind: http-request
description: Sin cookie de sesión responde `null`, no un error. (Cierra sesión antes para que el jar no tenga la cookie.)
url: "{{baseUrl}}/auth/get-session"
method: GET
headers:
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
scripts:
  - type: afterResponse
    code: pm.test('responde 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 6000
