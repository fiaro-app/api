$kind: http-request
description: "Los cuerpos son estrictos: un campo desconocido se rechaza en lugar de ignorarse."
url: "{{baseUrl}}/auth/sign-in/phone-number"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
body:
  type: json
  content: |-
    {
      "phoneNumber": "{{phone}}",
      "password": "{{password}}",
      "admin": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 400', () => pm.response.to.have.status(400));
      pm.test('el código de error es VALIDATION_FAILED', () => pm.expect(pm.response.json().code).to.eql('VALIDATION_FAILED'));
    language: text/javascript
order: 3000
