$kind: http-request
description: Borra la cartera de prueba (D-109). Se rechaza con 409 si es la cartera por defecto o si tiene cobradores activos asignados; esta no tiene ninguno.
url: "{{baseUrl}}/portfolios/{{portfolioId}}"
method: DELETE
headers:
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 6000
