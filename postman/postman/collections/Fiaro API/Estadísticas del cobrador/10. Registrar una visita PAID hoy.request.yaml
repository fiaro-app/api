$kind: http-request
description: "El id lo genera el dispositivo (aquí, el script previo con un UUID al azar): también es la llave de idempotencia. occurredAt usa la fecha de hoy calculada en el paso 6, para que aparezca en el resumen del día y en las estadísticas."
url: "{{baseUrl}}/loans/{{statsLoanId}}/collection-visits"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
body:
  type: json
  content: |-
    {
      "id": "{{statsPaidVisitId}}",
      "outcome": "PAID",
      "occurredAt": "{{statsToday}}T14:00:00.000Z",
      "payment": {
        "amount": 30000,
        "method": "CASH"
      }
    }
scripts:
  - type: prerequest
    code: |-
      pm.collectionVariables.set('statsPaidVisitId', pm.variables.replaceIn('{{$guid}}'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('responde 201', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('trae su pago en efectivo', () => pm.expect(body.payment.amount).to.eql(30000));
    language: text/javascript
order: 10000
