$kind: http-example
request:
  url: "{{baseUrl}}/auth/sign-in/phone-number"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Origin
      value: "{{baseUrl}}"
      description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
  body:
    type: json
    content: |-
      {
        "phoneNumber": "{{phone}}",
        "password": "{{password}}"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Invalid phone number or password",
        "code": "INVALID_PHONE_NUMBER_OR_PASSWORD"
      }
order: 2000
