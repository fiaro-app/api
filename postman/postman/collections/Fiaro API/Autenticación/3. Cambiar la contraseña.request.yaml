$kind: http-request
description: Cambia la contraseña con la actual como prueba. Siempre revoca las demás sesiones y responde con una sesión nueva (la cookie se reemplaza sola). Si la contraseña era temporal, quita `mustChangePassword`.
url: "{{baseUrl}}/auth/change-password"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
body:
  type: json
  content: |-
    {
      "currentPassword": "{{password}}",
      "newPassword": "{{newPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      pm.test('llega la cookie de sesión', () => pm.expect(pm.cookies.has('fiaro.session_token')).to.be.true);
      const body = pm.response.json();
      pm.test('la respuesta ya no marca contraseña temporal', () => pm.expect(body.user.mustChangePassword).to.be.false);
      pm.test('trae el token de la sesión nueva', () => pm.expect(body.token).to.be.a('string'));
    language: text/javascript
examples: ./.resources/3. Cambiar la contraseña.resources/examples
order: 3000
