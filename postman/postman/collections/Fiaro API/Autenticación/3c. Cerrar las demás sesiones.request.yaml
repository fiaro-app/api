$kind: http-request
description: "Cierra en el servidor todas las sesiones de la persona salvo la de la cookie (por ejemplo, si se perdió un teléfono). La de este dispositivo sigue vigente."
url: "{{baseUrl}}/auth/revoke-other-sessions"
method: POST
headers:
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      pm.test('la respuesta confirma el cierre', () => pm.expect(pm.response.json().status).to.be.true);
      pm.test('la sesión de esta cookie sigue vigente', () => pm.sendRequest({ url: pm.variables.get('baseUrl') + '/auth/get-session', method: 'GET' }, (err, res) => pm.expect(res.json()).to.not.eql(null)));
    language: text/javascript
order: 4300
