$kind: http-request
description: "La dueña también tiene el rol COLLECTOR (D-78), así que puede asignarse el préstamo a sí misma: esto dispara \"préstamo asignado\" (D-87) hacia su propio usuario, sin necesitar una segunda cuenta."
url: "{{baseUrl}}/loans/{{notifLoanId}}/collection-assignments"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
body:
  type: json
  content: |-
    {
      "collectorMembershipId": "{{notifOwnerMembershipId}}",
      "effectiveFrom": "2026-10-01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 5000
