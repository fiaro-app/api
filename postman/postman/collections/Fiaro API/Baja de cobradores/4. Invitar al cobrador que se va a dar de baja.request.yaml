$kind: http-request
description: El cobrador que, al final de la carpeta, se da de baja con su préstamo ya asignado.
url: "{{baseUrl}}/memberships"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
body:
  type: json
  content: |-
    {
      "phone": "{{deactivateCollectorOldPhone}}",
      "fullName": "Cobrador Saliente (prueba de baja de cobradores)",
      "nationalId": "{{deactivateCollectorOldNationalId}}",
      "contactEmail": "cobrador-{{deactivateCollectorOldNationalId}}@example.com",
      "roles": ["COLLECTOR"],
      "portfolioId": "{{deactivateCollectorPortfolioId}}"
    }
scripts:
  - type: prerequest
    code: |-
      const suffix = Math.floor(100000000 + Math.random() * 900000000);
      pm.collectionVariables.set('deactivateCollectorOldPhone', `+573${suffix}`);
      const nationalId = Math.floor(10000000 + Math.random() * 90000000);
      pm.collectionVariables.set('deactivateCollectorOldNationalId', `${nationalId}`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('responde 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('deactivateCollectorOldMembershipId', pm.response.json().membership.id);
    language: text/javascript
order: 4000
