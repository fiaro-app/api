$kind: http-request
description: "URL firmada de subida (PUT) y URL pública del logo una vez subido (D-102): el archivo va directo del dispositivo al bucket, nunca por la API. Solo se acepta PNG o JPEG de hasta 2 MB: la URL firma el tipo y el peso exactos (`sizeBytes`), y el bucket rechaza otra subida (D-132). Al guardar el logo, `PATCH /lender { logoUrl }` verifica que el archivo subido sea de verdad un PNG/JPEG de este negocio. Esta carpeta no lo sube de verdad ni llama PATCH /lender después: solo pide la URL."
url: "{{baseUrl}}/lender/logo-upload-url"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
body:
  type: json
  content: |-
    {
      "contentType": "image/png",
      "sizeBytes": 48213
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('trae una URL de subida y una URL pública', () => {
        pm.expect(body.uploadUrl).to.be.a('string').that.includes('logos/');
        pm.expect(body.publicUrl).to.be.a('string').that.includes('logos/');
      });
      pm.test('firma el tipo y el peso', () => pm.expect(body.uploadUrl).to.include('X-Amz-SignedHeaders=content-length%3Bcontent-type%3Bhost'));
      pm.test('vence en el futuro', () => pm.expect(new Date(body.expiresAt).getTime()).to.be.above(Date.now()));
    language: text/javascript
order: 5000
