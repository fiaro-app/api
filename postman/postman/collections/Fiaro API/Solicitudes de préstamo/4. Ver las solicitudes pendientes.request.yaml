$kind: http-request
description: "El administrador (OWNER o LENDER) ve las de todos los cobradores; un cobrador, solo las suyas (método QUERY)."
url: "{{baseUrl}}/loan-requests"
method: QUERY
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
body:
  type: json
  content: |-
    {
      "status": "PENDING"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 200', () => pm.response.to.have.status(200));
      pm.test('está la solicitud', () => pm.expect(pm.response.json().data.some((item) => item.id === pm.collectionVariables.get('loanRequestId'))).to.be.true);
    language: text/javascript
order: 4000
