$kind: http-request
description: "Persona deudora del prestamista con el que opera la sesión. Exige rol OWNER o LENDER en la membresía activa (Ana los tiene los tres, del registro). La cédula usa {{$timestamp}} para que la carpeta se pueda repetir sin chocar con la cédula de la vez anterior."
url: "{{baseUrl}}/clients"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{baseUrl}}"
    description: Las peticiones con cookie deben decir de dónde vienen; el origen de la API siempre es de confianza.
body:
  type: json
  content: |-
    {
      "nationalId": "{{$timestamp}}",
      "fullName": "Carlos Andrés Gómez (cliente de prueba)",
      "occupation": "Vendedor ambulante",
      "phone": "+573009998877",
      "address": "Calle 45 # 12-30, Bogotá"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('responde 201', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('trae el id del cliente', () => pm.expect(body.id).to.be.a('string'));
      pm.collectionVariables.set('clientId', body.id);
    language: text/javascript
order: 2000
