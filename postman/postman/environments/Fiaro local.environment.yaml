name: Fiaro local
values:
  - key: baseUrl
    value: 'http://localhost:3040'
    enabled: true
    type: default
    description: 'Origen de la API con `pnpm docker:dev`. Con `pnpm start:dev` es http://localhost:3000.'
  - key: phone
    value: '+573001234567'
    enabled: true
    type: default
    description: 'Ana Pérez, del seed de desarrollo (`pnpm docker:seed`).'
  - key: password
    value: 'fiaro-dev-2026'
    enabled: true
    type: default
    description: 'Contraseña de Ana Pérez en el seed de desarrollo. Es pública y solo sirve en desarrollo.'
  - key: newPassword
    value: 'fiaro-dev-2026-nueva'
    enabled: true
    type: default
    description: 'La que se pone al probar el cambio de contraseña; la colección vuelve a la original.'
  - key: tempPhone
    value: '+573109998877'
    enabled: true
    type: default
    description: 'Luis Gómez, cobrador con contraseña temporal en el seed de desarrollo.'
  - key: tempPassword
    value: 'temporal-2026'
    enabled: true
    type: default
    description: 'Contraseña temporal de Luis Gómez en el seed de desarrollo. Es pública y solo sirve en desarrollo.'
  - key: newTempPassword
    value: 'contraseña-propia-2026'
    enabled: true
    type: default
    description: 'La contraseña propia que elige Luis Gómez en su primer ingreso.'
  - key: fullName
    value: 'Ana Pérez'
    enabled: true
    type: default
    description: 'Nombre completo de Ana Pérez en el seed de desarrollo.'
  - key: contactEmail
    value: 'ana@fiaro.dev'
    enabled: true
    type: default
    description: 'Correo de contacto de Ana Pérez en el seed de desarrollo (para recuperar la contraseña y verificar el correo).'
  - key: resetCode
    value: ''
    enabled: true
    type: default
    description: 'Código de 6 dígitos que llega al pedir recuperar la contraseña (D-68). En modo desarrollo no se envía: sale en el log de la API como "Correo (modo desarrollo, no se envía) para ana@fiaro.dev...". Pégalo aquí antes de correr "2. Cambiar la contraseña con el código".'
  - key: contactEmailVerificationCode
    value: ''
    enabled: true
    type: default
    description: 'Código de 6 dígitos que llega al pedir verificar el correo de contacto (D-69). Mismo modo desarrollo que `resetCode`: revisa el log de la API y pégalo aquí antes de correr "3. Verificar el correo de contacto".'
  - key: deactivationPhone
    value: '+573112223344'
    enabled: true
    type: default
    description: 'Carla Ruiz, cuenta de prueba del seed de desarrollo dedicada a probar la desactivación (D-71): así nunca se desactiva a Ana ni a Luis, que las demás carpetas necesitan activos.'
  - key: deactivationPassword
    value: 'cuenta-de-prueba-2026'
    enabled: true
    type: default
    description: 'Contraseña de Carla Ruiz en el seed de desarrollo.'
